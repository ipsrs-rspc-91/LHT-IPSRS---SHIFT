<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Form Petugas (Static list + add)</title>
  <style>
    :root{--bg:#f5f7fb;--card:#fff;--accent:#0a69b8;--muted:#6b7280;--text:#071737;}
    body{font-family:Inter,system-ui,Arial;margin:24px;background:var(--bg);color:var(--text)}
    .card{background:var(--card);padding:16px;border-radius:10px;max-width:720px;margin:0 auto;border:1px solid rgba(0,0,0,0.06)}
    label{display:block;font-weight:700;margin-top:12px;color:#042a57}
    input,textarea,select,button{width:100%;padding:10px;border-radius:8px;border:1px solid rgba(0,0,0,0.12);margin-top:8px;font-size:15px}
    .row{display:flex;gap:8px}
    .row .col{flex:1}
    .btn{background:linear-gradient(90deg,var(--accent),#24a0ff);color:#fff;border:0;padding:10px;border-radius:8px;cursor:pointer}
    .muted{font-size:13px;color:var(--muted);margin-top:8px}
    .small{padding:8px;font-size:13px;border-radius:8px}
  </style>
</head>
<body>
  <div class="card">
    <h2>Input Laporan (Petugas: daftar statis + tambah lokal)</h2>

    <label for="Petugas">PETUGAS</label>
    <div style="display:flex;gap:8px;align-items:center">
      <input id="Petugas" list="PetugasList" placeholder="Pilih atau ketik nama..." />
      <button id="AddBtn" class="btn" style="flex:0 0 140px">Tambahkan</button>
    </div>
    <datalist id="PetugasList"></datalist>
    <div id="info" class="muted">Pilih nama dari daftar atau ketik lalu tekan "Tambahkan" untuk menyimpan secara lokal.</div>

    <label for="Tanggal">TANGGAL</label>
    <input id="Tanggal" type="date" />

    <label for="Masalah">MASALAH / KEGIATAN</label>
    <textarea id="Masalah" rows="3"></textarea>

    <div style="display:flex;gap:8px;margin-top:12px">
      <button id="SaveReport" class="btn" style="flex:1">Simpan (demo)</button>
      <button id="ResetList" class="small">Reset daftar ke awal</button>
    </div>

    <div id="msg" class="muted"></div>
  </div>

<script>
/*
  Static list initialized with the names you provided.
  User-added names are stored in localStorage so they persist on this browser.
*/

const INITIAL_PETUGAS = [
  "Pantiaro",
  "Agung",
  "Rusdi",
  "Kartolo",
  "Kabul",
  "Setu",
  "Sunandar",
  "Wawan",
  "Teguh",
  "Sulaiman",
  "Rohim",
  "Sobur",
  "Suryanto",
  "Suryadih",
  "Heri",
  "Adang",
  "Fahmi",
  "Raihan"
];

const STORAGE_KEY = 'static_petugas_list_v1';

// load list from localStorage; fallback to INITIAL_PETUGAS
function loadPetugas(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return dedupePreserveOrder(INITIAL_PETUGAS.slice());
    const arr = JSON.parse(raw);
    if(Array.isArray(arr) && arr.length) return dedupePreserveOrder(arr);
    return dedupePreserveOrder(INITIAL_PETUGAS.slice());
  }catch(e){
    return dedupePreserveOrder(INITIAL_PETUGAS.slice());
  }
}

// save to storage
function savePetugas(arr){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(dedupePreserveOrder(arr))); }catch(e){}
}

// build datalist DOM
function buildDatalist(arr){
  const dl = document.getElementById('PetugasList');
  dl.innerHTML = '';
  const seen = new Set();
  arr.forEach(name=>{
    if(!name) return;
    const key = name.trim().toLowerCase();
    if(seen.has(key)) return;
    seen.add(key);
    const opt = document.createElement('option');
    opt.value = name.trim();
    dl.appendChild(opt);
  });
}

// add new local name
function addNamaBaru(name){
  if(!name || !name.trim()) return { ok:false, msg:'Nama kosong' };
  const current = loadPetugas();
  if(current.map(n=>n.toLowerCase()).includes(name.toLowerCase())){
    return { ok:false, msg:'Nama sudah ada' };
  }
  current.push(capitalizeEachWord(name.trim()));
  savePetugas(current);
  buildDatalist(current);
  return { ok:true };
}

// reset to initial static list
function resetToInitial(){
  savePetugas(INITIAL_PETUGAS.slice());
  buildDatalist(INITIAL_PETUGAS.slice());
}

// helper: dedupe while preserving order and normalize spacing
function dedupePreserveOrder(arr){
  const out = [];
  const seen = new Set();
  arr.forEach(s=>{
    if(!s) return;
    const v = s.toString().trim();
    const key = v.toLowerCase();
    if(seen.has(key)) return;
    seen.add(key);
    out.push(v);
  });
  return out;
}

function capitalizeEachWord(s){
  return s.split(/\s+/).map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ');
}

// initialization
(function init(){
  const list = loadPetugas();
  buildDatalist(list);

  const addBtn = document.getElementById('AddBtn');
  const petugasInput = document.getElementById('Petugas');
  const msg = document.getElementById('msg');

  addBtn.addEventListener('click', () => {
    const name = petugasInput.value || '';
    if(!name.trim()){
      showMsg('Masukkan nama terlebih dahulu.', true);
      return;
    }
    const res = addNamaBaru(name);
    if(res.ok){
      showMsg('Nama petugas disimpan secara lokal.', false);
    } else {
      showMsg(res.msg, true);
    }
  });

  // demo save report (no server)
  document.getElementById('SaveReport').addEventListener('click', ()=>{
    const payload = {
      Tanggal: document.getElementById('Tanggal').value,
      Petugas: document.getElementById('Petugas').value,
      Masalah: document.getElementById('Masalah').value
    };
    if(!payload.Tanggal){ showMsg('Isi tanggal dulu.', true); return; }
    if(!payload.Petugas){ showMsg('Pilih atau isi nama petugas.', true); return; }
    showMsg('Data tersimpan (demo). Payload: ' + JSON.stringify(payload), false);
    // Optionally: send payload to your server/API here.
  });

  document.getElementById('ResetList').addEventListener('click', ()=>{
    if(confirm('Reset daftar petugas ke daftar awal?')) resetToInitial();
  });

  function showMsg(text, isError=false){
    msg.innerText = text;
    msg.style.color = isError ? '#e02424' : '#1f9d55';
    setTimeout(()=>{ if(msg.innerText === text) msg.innerText = ''; }, 4000);
  }
})();
</script>
</body>
</html>
